<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="description" content="Folded Paper Engine">
    <title>Folded Paper Engine</title>
    <link rel="icon" type="image/png" href="./icons/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg"/>
    <link rel="shortcut icon" href="./icons/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png"/>
    <meta name="apple-mobile-web-app-title" content="Folded Paper Engine"/>
    <link rel="manifest" href="./icons/site.webmanifest.json"/>
    <link rel="stylesheet" href="./index.css">
    <style>
        .web-splash-inner {
            &.web-splash-loading {
                position: relative;
                overflow: hidden;

                --stripe: 28px;
                --speed: 3s;
                --c1: #9fb837;
                --c2: #b9d94a;

                &::before {
                    content: "";
                    position: absolute;
                    inset: -25%;
                    background: repeating-linear-gradient(
                            45deg,
                            var(--c1) 0 calc(var(--stripe)),
                            var(--c2) calc(var(--stripe)) calc(var(--stripe) * 2)
                    );
                    transform: translate3d(0, 0, 0);
                    animation: web-splash-candy var(--speed) linear infinite;
                    will-change: transform;
                    pointer-events: none;
                    z-index: 1;
                }
            }

            & > .apple-sticker,
            & > .star-sticker,
            & > .demo-button {
                position: relative;
                z-index: 2;
            }
        }

        @keyframes web-splash-candy {
            from {
                transform: translate3d(0, 0, 0);
            }
            to {
                transform: translate3d(calc(var(--stripe) * 2), calc(var(--stripe) * 2), 0);
            }
        }
    </style>
    <script type="module">

      const demoButton = document.querySelector('.demo-button');
      const loadDemoGame = async () => {
        const webSplashInner = document.querySelector(".web-splash-inner");

        webSplashInner.innerHTML = "";
        webSplashInner.classList.add('web-splash-loading');

        // await loadGodot({
        //   basePath: "./demo-game",
        //   executable: "index",
        //   canvas: webSplashInner,
        // }).catch(err => {
        //   console.error("Godot failed to start:", err);
        // });
        //
        // webSplashInner.classList.remove('web-splash-loading');
      };

      demoButton.addEventListener('click', loadDemoGame);
    </script>
</head>
